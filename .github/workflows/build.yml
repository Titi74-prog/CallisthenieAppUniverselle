name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses > /dev/null || true
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Build Debug APK
      run: gradle assembleDebug
    - name: Rename APK
      run: |
        V=$(grep versionName app/build.gradle | sed 's/[^0-9.]//g')
        echo "V=$V" >> $GITHUB_ENV
        cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Callisthenie-Generique-v$V.apk"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Callisthenie-Generique-v${{ env.V }}
        path: app/build/outputs/apk/debug/Callisthenie-Generique-v${{ env.V }}.apk
        retention-days: 30
